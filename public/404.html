<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Emiliano García Fuenzalida</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0C0C0C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      With this file present Cloudflare Pages answers unknown paths with a real
      404 instead of serving the home page with a 200, which search engines
      treat as duplicate content ("soft 404").
    -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #0C0C0C; color: #fff; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { width: 100%; max-width: 34rem; border-top: 1px solid rgba(255, 255, 255, 0.15); padding-top: 1rem; }
      .label { font: 11px/1.4 ui-monospace, 'JetBrains Mono', Consolas, monospace; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); }
      h1 { margin-top: 2.5rem; font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
      p { margin-top: 0.75rem; color: rgba(255, 255, 255, 0.7); }
      a { display: inline-block; margin-top: 2rem; padding: 0.7rem 1.4rem; border-radius: 999px; background: #fff; color: #000; font-weight: 500; text-decoration: none; }
      a:hover { background: rgba(255, 255, 255, 0.8); }
    </style>
  </head>
  <body>
    <main>
      <p class="label">404 · Emiliano García Fuenzalida</p>
      <h1>This page doesn't exist.</h1>
      <p>Esta página no existe. The portfolio lives on a single page.</p>
