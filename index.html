<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Marks the document as script-capable before anything paints, so the
      static copy of the content inside #root (written by scripts/postbuild.mjs
      for crawlers and clients that do not run scripts) never flashes for a
      real visitor. React clears #root on mount anyway.
    -->
    <script>document.documentElement.className = 'js';</script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Preload the two hero layers so they are ready when the loader exits.
      Same widths and sizes as src/components/landing/heroImages.ts — keep both
      in sync or the hero downloads twice.
    -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://res.cloudinary.com/drkpykb3l/image/upload/f_auto,q_auto,c_limit,w_1920/v1784206503/magnific_necesito-que-saques-el-ci_kLFpV3O16B_1_txhw7u.png"
      imagesrcset="https://res.cloudinary.com/drkpykb3l/image/upload/f_auto,q_auto,c_limit,w_1280/v1784206503/magnific_necesito-que-saques-el-ci_kLFpV3O16B_1_txhw7u.png 1280w, https://res.cloudinary.com/drkpykb3l/image/upload/f_auto,q_auto,c_limit,w_1920/v1784206503/magnific_necesito-que-saques-el-ci_kLFpV3O16B_1_txhw7u.png 1920w, https://res.cloudinary.com/drkpykb3l/image/upload/f_auto,q_auto,c_limit,w_2752/v1784206503/magnific_necesito-que-saques-el-ci_kLFpV3O16B_1_txhw7u.png 2752w"
      imagesizes="(max-aspect-ratio: 177/100) 177vh, 100vw"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://res.cloudinary.com/drkpykb3l/image/upload/f_auto,q_auto,c_limit,w_1920/v1784206503/magnific_necesito-que-hagas-una-ve_XtV4GMOBfo_1_p0ljao.png"
      imagesrcset="https://res.cloudinary.com/drkpykb3l/image/upload/f_auto,q_auto,c_limit,w_1280/v1784206503/magnific_necesito-que-hagas-una-ve_XtV4GMOBfo_1_p0ljao.png 1280w, https://res.cloudinary.com/drkpykb3l/image/upload/f_auto,q_auto,c_limit,w_1920/v1784206503/magnific_necesito-que-hagas-una-ve_XtV4GMOBfo_1_p0ljao.png 1920w, https://res.cloudinary.com/drkpykb3l/image/upload/f_auto,q_auto,c_limit,w_2752/v1784206503/magnific_necesito-que-hagas-una-ve_XtV4GMOBfo_1_p0ljao.png 2752w"
      imagesizes="(max-aspect-ratio: 177/100) 177vh, 100vw"
    />

    <!-- Primary meta -->
    <title>Emiliano García Fuenzalida — UX/UI &amp; Product Designer</title>
    <meta name="description" content="UX/UI &amp; Product Designer based in Mendoza, Argentina. Research, interface design and prototyping for AI products, data tools and design systems, built in React." />
    <meta name="keywords" content="UX Designer, UI Designer, Product Designer, AI Product Design, Design Systems, Prototyping, Figma, React, XR, Portfolio, Argentina" />
    <meta name="author" content="Emiliano García Fuenzalida" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="theme-color" content="#0C0C0C" />
    <meta name="google-site-verification" content="qR4PWqCYvXVECwC13hZWL-Vu2EGHZWSpHMg7osprHu0" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="canonical" href="https://emigarciafuenzalidadesign.pages.dev/" />

    <!-- Open Graph / LinkedIn / WhatsApp. Image URLs must be absolute. -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://emigarciafuenzalidadesign.pages.dev/" />
    <meta property="og:site_name" content="Emiliano García Fuenzalida — Portfolio" />
    <meta property="og:title" content="Emiliano García Fuenzalida — UX/UI &amp; Product Designer" />
    <meta property="og:description" content="Research, interface design and prototyping for AI products, data tools and design systems. Case studies, experience and CV." />
    <meta property="og:image" content="https://emigarciafuenzalidadesign.pages.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Emiliano García Fuenzalida — UX/UI &amp; Product Designer, Mendoza, Argentina" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_AR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emiliano García Fuenzalida — UX/UI &amp; Product Designer" />
    <meta name="twitter:description" content="Research, interface design and prototyping for AI products, data tools and design systems. Case studies, experience and CV." />
    <meta name="twitter:image" content="https://emigarciafuenzalidadesign.pages.dev/og-image.jpg" />

    <!-- Structured data (schema.org) is generated at build time by scripts/postbuild.mjs. -->
    <!--JSONLD-->
  </head>
  <body>
    <!--
      scripts/postbuild.mjs replaces the placeholder below with a plain-HTML
      copy of the site's content (EN + ES). Crawlers that do not run scripts —
      every AI crawler today — read that copy; React replaces it on mount.
    -->
    <div id="root"><!--STATIC--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
